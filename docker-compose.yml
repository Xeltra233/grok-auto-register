services:
  panel:
    build: .
    image: grok-auto-register:panel
    container_name: grok-auto-register
    ports:
      - "8787:8787"
    environment:
      PANEL_HOST: "0.0.0.0"
      PORT: "8787"
      PANEL_PORT: "8787"
      # 0=disable embedded GoProxy; 1=start prebuilt binary in image
      GOPROXY_ENABLED: "0"
      # Optional: GROK_PANEL_PASSWORD: "your-password"
    volumes:
      - ./config:/app/config
      - ./cpa_auths:/app/cpa_auths
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
